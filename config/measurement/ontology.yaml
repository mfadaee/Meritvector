# MeritVector measurement ontology — job-family independent.
# Edit this file to change construct definitions; code reads it at runtime.
# evidence_status: established | reasonable_hypothesis | product_assumption
version: "1.0"
conceptual_model:
  statement: >-
    Observed results = individual contribution + team contribution + organisational environment +
    project conditions + opportunity + random variation + measurement error.
  caveat: >-
    A conceptual decomposition, not a claim that the components are separately identifiable or
    literally additive. Individual contribution is identifiable only partially, under assumptions,
    and with uncertainty.
  references: [campbell1993, griffin2007, messick1995]
constructs:
  activity:
    label: Activity
    definition: Observable work events — meetings, tasks created or closed, messages, time allocation.
    indicators: [meetings attended, tasks created/closed, updates sent, hours recorded]
    data_sources: [calendar metadata, task tools, (synthetic) Graph activity summaries]
    assumptions: [Counts are complete for the systems connected.]
    reliability: High recording reliability; low construct relevance to merit.
    confounders: [role, organisational meeting culture, workload, team size, time zone]
    limitations: [Rewards visible busyness (Kerr 1975); easily gamed (Strathern 1997).]
    intended_use: Organisational context and workload diagnostics.
    prohibited_interpretations: [higher activity means higher performance, activity as a promotion signal]
    may_increase_merit: false
    evidence_status: established
    references: [kerr1975, strathern1997, bernstein2012]
  responsibility:
    label: Responsibility
    definition: What the person is actually accountable for — decision authority, budget, risk ownership, scope, autonomy — independent of job title.
    indicators: [decision authority level, budget accountability, accountable workstreams, teams coordinated, risk ownership, executive exposure, autonomy]
    data_sources: [PMO register assignment records, RACI, project charter]
    assumptions: [Assignment records reflect actual, not nominal, accountability.]
    reliability: Moderate; nominal ownership often differs from practice — requires manager verification.
    confounders: [job title, visibility, organisational politics]
    limitations: [Scale of responsibility is not performance; a small project can demand exceptional judgement.]
    intended_use: Describe scope so outcomes and contributions are read in proportion.
    prohibited_interpretations: [larger scope means better performance, responsibility as a ranking key]
    may_increase_merit: false
    evidence_status: reasonable_hypothesis
    references: [campbell2015]
  complexity:
    label: Complexity
    definition: Difficulty and uncertainty of the work — technical novelty, dependencies, regulation, scale, resourcing, schedule and integration risk.
    indicators: [technical complexity, dependency count, resource constraint, scope volatility, regulatory environment, technical uncertainty, integration points]
    data_sources: [PMO complexity assessment at kick-off, change log, dependency register]
    assumptions: [Assessed at kick-off before outcomes are known; assessors are not anchored on the assigned person.]
    reliability: Moderate; rubric-based assessment by the PMO. Inter-assessor reliability not yet measured.
    confounders: [assignment of stronger people to harder work, optimistic or pessimistic assessors]
    limitations: [Only measured complexity can be adjusted for; unmeasured context remains.]
    intended_use: Contextual adjustment of outcomes; fair comparison of operating conditions.
    prohibited_interpretations: [complexity as performance credit by itself]
    may_increase_merit: false
    evidence_status: established
    references: [griffin2007, greenland1999]
  quality:
    label: Quality
    definition: Evidence of correctness, completeness and sustainability of work products.
    indicators: [deliverable review score, first-pass approval, defects after acceptance, handover acceptance]
    data_sources: [document approval workflow, quality board reviews]
    assumptions: [Reviews apply a consistent rubric.]
    reliability: Reviewer effects likely; scores missing non-randomly (synthetic data — internal projects).
    confounders: [reviewer leniency, project environment, missingness]
    limitations: [Review score is a judgement, not ground truth.]
    intended_use: Secondary outcome alongside schedule; quality evidence for competencies.
    prohibited_interpretations: [single review as proof of capability]
    may_increase_merit: true
    evidence_status: reasonable_hypothesis
    references: [podsakoff2003, rubin1976]
  outcomes:
    label: Outcomes
    definition: What the work achieved — milestones, schedule and cost performance, benefits, risks avoided.
    indicators: [schedule variance, on-time milestones, budget variance, benefits case met, risk materialisation]
    data_sources: [PMO register, project closure reviews]
    assumptions: [Baselines were set before execution; re-baselining is recorded.]
    reliability: High recording reliability for dates; moderate for benefits.
    confounders: [all context variables, team, sponsor, luck, regression to the mean]
    limitations: [Results are not behaviour (Campbell 1993); outcomes are shared across teams.]
    intended_use: Project and portfolio reporting; input to context-adjusted analysis.
    prohibited_interpretations: [project outcome equals individual performance]
    may_increase_merit: false
    evidence_status: established
    references: [campbell1993, campbell2015]
  contribution:
    label: Contribution
    definition: The individual's evidenced role in producing outcomes, relative to what conditions predict, without attributing team results to one person.
    indicators: [context-adjusted schedule estimate with interval, verified attributions on evidence chains, risk mitigation led]
    data_sources: [engineered features from assessment evidence; manager-verified attributions]
    assumptions: [Measured context captures the main confounders; attribution is verified by people who know the work.]
    reliability: Limited; estimates are shrunk and abstain when evidence is thin.
    confounders: [unmeasured context, team quality, non-random assignment]
    limitations: [Adjusted associations, not causal effects; shared outcomes limit attribution (Scenario F).]
    intended_use: Evidence for development conversations with human review.
    prohibited_interpretations: [ranking, promotion or dismissal decisions, causal claims about individuals]
    may_increase_merit: true
    evidence_status: product_assumption
    references: [greenland1999, cinelli2020]
  development:
    label: Development
    definition: Demonstrated improvement in capability or performance over time, accounting for changing conditions.
    indicators: [trend in context-adjusted signal, growth-model slope, competencies newly demonstrated, harder assignments handled]
    data_sources: [longitudinal engineered features]
    assumptions: [Enough periods with evidence; conditions measured per period.]
    reliability: Low per person at current evidence density (see MODEL_CARD — no flags after FDR).
    confounders: [regression to the mean, assignment changes, turnover]
    limitations: [Under-powered; changes in responsibility confound trends.]
    intended_use: Development conversations; never a rating.
    prohibited_interpretations: [lack of detected change means no growth]
    may_increase_merit: true
    evidence_status: reasonable_hypothesis
    references: [barnett2005, pulakos2000]
  leadership:
    label: Leadership
    definition: Evidence of coordination, sound judgement, collaboration, influence and enabling others.
    indicators: [cross-unit dependencies resolved, risks escalated and resolved with others, stakeholder outcomes, attributions as enabler]
    data_sources: [dependency register, RAID log, stakeholder surveys, verified attributions]
    assumptions: [Leadership leaves traces in coordination records; much of it does not.]
    reliability: Low; perception-based and incomplete.
    confounders: [visibility, role, survey response bias]
    limitations: [Contextual performance is under-recorded (Borman & Motowidlo 1993).]
    intended_use: Identify evidence and evidence gaps for development.
    prohibited_interpretations: [absence of records means absence of leadership]
    may_increase_merit: true
    evidence_status: reasonable_hypothesis
    references: [borman1993, motowidlo1994, podsakoff2000]
  career_capability_evidence:
    label: Career capability evidence
    definition: Observed capabilities relevant to a separately defined future role.
    indicators: [competencies demonstrated beyond current level, opportunities offered and taken]
    data_sources: [competency evidence mapping against target-role framework]
    assumptions: [Target role requirements are defined independently of current performance.]
    reliability: Depends on opportunity; gaps often reflect assignment, not capability.
    confounders: [opportunity, visibility, sponsorship]
    limitations: [Current performance does not imply readiness for a different role.]
    intended_use: Inform development planning; requires qualified human review.
    prohibited_interpretations: [promotion readiness score, automatic promotion or rejection]
    may_increase_merit: false
    evidence_status: product_assumption
    references: [campbell2015]
