name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Backend, analytics & model validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Fetch public real-world datasets (pinned commit, checksum-verified)
        run: python scripts/fetch_public_data.py
      - name: Tests (unit, API integration, full-size model validation, public-data studies)
        env:
          MV_REQUIRE_PUBLIC_DATA: "1"
        run: pytest -q
      - name: Execute flagship experiment notebook
        run: python scripts/build_notebook.py --execute

  web:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Compose startup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: |
          echo "MV_SECRET_KEY=$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" > .env
          docker compose up -d --build
      - name: Wait for API (bootstrap + training)
        run: |
          for i in $(seq 1 90); do
            curl -fs http://localhost:8000/health && break
            sleep 5
          done
          curl -fs http://localhost:8000/health
      - name: Smoke test
        run: |
          curl -fs http://localhost:8000/auth/demo-personas | python3 -c "import json,sys; p=json.load(sys.stdin); assert len(p) >= 4, p"
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:3000/login && break; sleep 2; done
          curl -fs -o /dev/null http://localhost:3000/login
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
